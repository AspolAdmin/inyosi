<body>

<section class="hero">
  <h1 class="hero__greeting">Hello B <span class="hero__heart" aria-label="love">&#9829;</span></h1>
</section>

<footer class="site-footer">
  <a href="mailto:b@inyosi.com" class="site-footer__contact">b@inyosi.com</a>
  <span class="site-footer__copy">&copy; inyosi 2026</span>
</footer>

<script>
(function () {
  var heart = document.querySelector('.hero__heart');
  heart.addEventListener('animationend', function () { heart.classList.remove('is-pulsing'); });
  (function schedule() {
    setTimeout(function () {
      heart.classList.add('is-pulsing');
      schedule();
    }, 3000 + Math.random() * 3000);
  })();
})();
</script>
</body>
